<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>文字格式</title>
</head>
<body>
	<!-- 這是註解 -->
	<p>一般文字</p>
	<p><b>一般文字粗體</b></p>
	<p><strong>一般文字重要</strong></p>
	<p><i>一般文字斜體</i></p>
	<p><em>一般文字強調</em></p>
	<p><mark>一般文字標記</mark></p>
	<p><small>一般文字縮小</small></p>
	<p><del>一般文字刪除</del></p>
	<p><ins>一般文字底線</ins></p>
	<p>一般文字<sub>下標</sub></p>
	<p>一般文字<sup>上標</sup></p>
	<p><a href="index.htm">回首頁</a></p>
</body>
</html>
